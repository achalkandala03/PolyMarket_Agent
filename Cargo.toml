[package]
name = "kalshi-btc-bot"
version = "0.1.0"
edition = "2021"
description = "15-minute BTC Kalshi trading bot (binary Yes/No markets)"
default-run = "kalshi-btc-bot"

[[bin]]
name = "kalshi-btc-bot"
path = "src/main.rs"

[[bin]]
name = "analyze_target_history"
path = "src/bin/analyze_target_history.rs"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
rust_decimal = "1.33"
rust_decimal_macros = "1.33"
sha2 = "0.10"
base64 = "0.21"
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.9"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
